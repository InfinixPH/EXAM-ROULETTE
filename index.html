  background-size: cover, cover; background-position: center, center;

}
.bg-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(135deg,rgba(3,5,18,0.38) 0%,rgba(20,10,50,0.28) 40%,rgba(91,31,181,0.22) 70%,rgba(3,5,18,0.42) 100%);
  z-index: 1;
}
.halftone {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background-image: radial-gradient(circle, rgba(41,214,255,0.18) 1.2px, transparent 1.2px);
  background-size: 18px 18px;
  mix-blend-mode: screen;
}

/* ── MASCOT ── */
.mascot-right {
  position: fixed; right: -6px; bottom: -10px;
  width: 420px; max-width: 42vw; z-index: 4;
  pointer-events: none;
  filter: drop-shadow(0 10px 40px rgba(0,0,0,0.55)) drop-shadow(0 0 45px rgba(255,46,154,0.55));
}
@media (max-width: 760px) {
  .mascot-right { width: 240px; max-width: 52vw; right: -4px; bottom: -6px; }
}

/* ── MAIN CONTAINER ── */
.container {
  position: relative; z-index: 10;
  width: 100%; max-width: 760px; margin: 0 auto;
}

/* ── HEADER ── */
.header { text-align: center; margin-bottom: 6px; }
.logo-action-wrap {
  display: inline-block; position: relative;
  margin-bottom: 8px; padding: 0 10px;
}
.logo-panel {
  position: relative; z-index: 1;
  display: inline-block;
  background: rgba(3,5,18,0.82);
  border: 3px solid var(--orange);
  border-radius: 14px; padding: 8px 28px 6px;
  backdrop-filter: blur(14px);
  box-shadow:
    0 0 0 2px rgba(156,240,255,0.3),
    0 0 35px rgba(255,46,154,0.40),
    inset 0 0 20px rgba(41,214,255,0.08),
    5px 5px 0 rgba(91,31,181,0.65);
  overflow: hidden;
}
.logo-panel::before {
  content: ''; position: absolute; top:0; left:-100%;
  width:55%; height:100%;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);
  animation: sheen 3.5s ease-in-out infinite;
}
@keyframes sheen { 0%{left:-100%} 50%{left:130%} 100%{left:130%} }
.logo-text {
  font-family: 'Bangers', Impact, sans-serif;
  font-size: 1.9rem;
  letter-spacing: 6px;
  text-transform: uppercase;
  background: linear-gradient(160deg, #D8ECFF 0%, #29D6FF 30%, #FF2E9A 55%, #9CF0FF 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 12px rgba(41,214,255,0.8));
  line-height: 1.2;
  padding: 0 4px;
}
.brand-logo {
  display: block;
  width: clamp(200px, 42vw, 320px);
  height: auto;
  margin: 4px auto 10px;
  filter: drop-shadow(0 0 18px rgba(41,214,255,0.55)) drop-shadow(0 0 34px rgba(255,46,154,0.30));
}
.subtitle-tag {
  display: inline-block;
  background: linear-gradient(90deg, var(--orange), var(--purple2));
  color: var(--white); font-family: 'Bebas Neue', sans-serif;
  font-size: 0.7rem; letter-spacing: 3px; padding: 3px 14px;
  border-radius: 999px; text-transform: uppercase;
  box-shadow: 0 0 16px rgba(255,46,154,0.4), 3px 3px 0 rgba(91,31,181,0.5);
}

/* ── COMIC CARD ── */
.comic-card {
  background: transparent;
  border-radius: 26px;
  border: 3px solid rgba(255,46,154,0.60);
  box-shadow:
    0 0 0 1px rgba(156,240,255,0.20),
    0 0 50px rgba(255,46,154,0.20),
    7px 7px 0 rgba(91,31,181,0.50);
  padding: 16px; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.comic-card::before {
  content: ''; position: absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--orange), var(--purple2), var(--orange2));
}

/* ── WHEEL ── */
.wheel-outer {
  display: flex; justify-content: center; margin: 2px 0 10px;
  position: relative;
}
.wheel-ring {
  position: relative; width: clamp(220px, 54vw, 340px); height: clamp(220px, 54vw, 340px); border-radius: 50%;
  box-shadow:
    0 0 0 5px rgba(255,46,154,0.75),
    0 0 0 10px rgba(156,240,255,0.28),
    0 0 60px rgba(255,46,154,0.38),
    0 0 110px rgba(91,31,181,0.22);
}
canvas {
  position: absolute; top:0; left:0;
  width:100% !important; height:100% !important;
  border-radius: 50%;
}
.pointer-wrap {
  position: absolute; top:-22px; left:50%;
  transform: translateX(-50%); z-index: 20;
  display: flex; flex-direction: column; align-items: center;
}
.pointer-tri {
  width:0; height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:32px solid #FF2E9A;
  filter: drop-shadow(0 0 10px rgba(255,46,154,0.95));
}
.pointer-dot {
  width:11px; height:11px; background:var(--orange2);
  border-radius:50%; margin-top:-5px;
  box-shadow: 0 0 14px rgba(41,214,255,1);
}

/* ── SPIN NOTE ── */
.spin-note {
  text-align: center;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  font-weight: 900; font-size: 0.85rem;
  color: var(--purple3);
  margin: 0 auto 8px;
  padding: 5px 14px;
  width: fit-content; max-width: 100%;
  border: 1.5px dashed rgba(156,240,255,0.55);
  border-radius: 999px;
  background: rgba(91,31,181,0.14);
}
.spin-note.used { color: var(--orange3); border-color: rgba(255,210,61,0.6); background: rgba(255,46,154,0.14); }

/* ── SPIN BUTTON ── */
.spin-btn {
  display: block; width: min(380px,90%);
  margin: 0 auto 6px; padding: 9px 20px;
  font-family: 'Bangers', Impact, sans-serif;
  font-size: 1.15rem; letter-spacing: 3px; text-transform: uppercase;
  cursor: pointer; border-radius: 16px;
  border: 3px solid rgba(255,210,61,0.6);
  background: linear-gradient(135deg, #FF2E9A 0%, #29D6FF 45%, #00A8FF 100%);
  color: var(--white); text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  box-shadow:
    0 0 24px rgba(255,46,154,0.45),
    4px 4px 0 rgba(91,31,181,0.65),
    inset 0 1px 0 rgba(255,255,255,0.28);
  transition: all 0.18s ease; position: relative; overflow: hidden;
}
.spin-btn::after {
  content:''; position:absolute; top:0; left:-80%;
  width:55%; height:100%;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
  transform:skewX(-20deg); transition:0.5s;
}
.spin-btn:hover::after { left:130%; }
.spin-btn:hover { transform:translate(-2px,-3px) scale(1.02); box-shadow:0 0 40px rgba(255,46,154,0.65),7px 7px 0 rgba(91,31,181,0.7); }
.spin-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(91,31,181,0.5); }
.spin-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
.spin-btn:disabled:hover::after { left:-80%; }

/* ── RESULT CARD ── */
.result-card {
  background: linear-gradient(145deg,rgba(255,46,154,0.10),rgba(91,31,181,0.12));
  border: 2px solid rgba(41,214,255,0.38); border-radius: 16px;
  padding: 7px; text-align: center;
  box-shadow: inset 0 0 22px rgba(255,46,154,0.06), 3px 3px 0 rgba(91,31,181,0.35);
  transition: transform 0.2s ease; position: relative; overflow: visible;
}
.result-label {
  font-family: 'Bebas Neue', sans-serif; font-size: 0.58rem;
  letter-spacing: 3px; color: var(--orange2); margin-bottom: 2px; text-transform: uppercase;
}
.result-text {
  font-family: 'Bangers', Impact, sans-serif; font-size: 1.5rem; letter-spacing: 3px;
  background: linear-gradient(135deg, #D8ECFF, #29D6FF 50%, #9CF0FF);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(2px 2px 0 rgba(91,31,181,0.55)); margin: 1px 0;
}
.open-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--orange), var(--purple2));
  color: var(--white); font-family: 'Bebas Neue', sans-serif;
  font-size: 0.85rem; letter-spacing: 2px; padding: 6px 18px;
  border-radius: 12px; text-decoration: none; margin-top: 4px;
  box-shadow: 3px 3px 0 rgba(91,31,181,0.65), 0 0 22px rgba(255,46,154,0.38);
  transition: 0.2s; border: 2px solid rgba(255,255,255,0.22);
}
.open-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(91,31,181,0.8),0 0 32px rgba(255,46,154,0.55); }

/* ── POW BUBBLE ── */
.pow-bubble {
  display: none;
  position: absolute;
  top: -60px; left: 50%; transform: translateX(-50%) scale(0) rotate(-8deg);
  z-index: 100; pointer-events: none;
  font-family: 'Bangers', Impact, sans-serif;
  font-size: 2.4rem; letter-spacing: 3px;
  color: #070B1E;
  background: radial-gradient(ellipse at 50% 55%, #FFD700 60%, #29D6FF 100%);
  padding: 12px 28px 14px;
  border-radius: 50%;
  border: 4px solid #FF2E9A;
  box-shadow: 4px 4px 0 rgba(91,31,181,0.8), 0 0 30px rgba(255,215,0,0.6);
  white-space: nowrap;
}
.pow-bubble.show {
  display: block;
  animation: powPop 1.4s cubic-bezier(0.36,0.07,0.19,0.97) forwards;
}
.pow-bubble::before {
  content: '';
  position: absolute; inset: -14px;
  background: inherit;
  border-radius: 50%;
  z-index: -1;
  clip-path: polygon(
    50% 0%,58% 6%,65% 2%,70% 9%,78% 6%,80% 14%,88% 13%,87% 22%,95% 23%,92% 31%,100% 35%,95% 42%,100% 48%,94% 53%,97% 60%,90% 63%,91% 71%,83% 72%,82% 80%,74% 79%,70% 87%,62% 84%,57% 91%,50% 88%,43% 91%,38% 84%,30% 87%,26% 79%,18% 80%,17% 72%,9% 71%,10% 63%,3% 60%,6% 53%,0% 48%,5% 42%,0% 35%,8% 31%,5% 23%,13% 22%,12% 13%,20% 14%,22% 6%,30% 9%,35% 2%,42% 6%
  );
}
@keyframes powPop {
  0%   { transform:translateX(-50%) scale(0) rotate(-8deg); opacity:0; }
  18%  { transform:translateX(-50%) scale(1.25) rotate(4deg); opacity:1; }
  32%  { transform:translateX(-50%) scale(0.95) rotate(-3deg); opacity:1; }
  46%  { transform:translateX(-50%) scale(1.08) rotate(2deg); opacity:1; }
  65%  { transform:translateX(-50%) scale(1.0) rotate(0deg); opacity:1; }
  85%  { transform:translateX(-50%) scale(1.0) rotate(0deg); opacity:1; }
  100% { transform:translateX(-50%) scale(0.8) rotate(5deg); opacity:0; }
}

/* ── CONFETTI ── */
.confetti-container {
  position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 12px; height: 12px;
  opacity: 0;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
}

/* ── META & HISTORY ── */
.meta-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 4px 2px; font-size: 0.58rem;
  color: rgba(216,236,255,0.45); letter-spacing: 1px; text-transform: uppercase;
  font-family: 'Bebas Neue', sans-serif;
}

@media (max-width:500px) {
  .title-comic { font-size:1.35rem; }
  .spin-btn { font-size:1rem; padding:8px; }
  .result-text { font-size:1.3rem; }
}
</style>

<script>

// ============================================================
// 🔗 ONLY EDIT THIS — paste your links here, one per line
// Add or remove as many as you want — wheel auto-adjusts
// NOTE: keep the ORDER of this list stable once the exam is live.
// Set numbers follow the order (Set 1 = first link, etc.)
// ============================================================
const LINKS = [
"https://docs.google.com/forms/d/e/1FAIpQLSc6RoEleJvfPPrQSks5ao9rFvrpTT6XjbR3kKJOVJRjc4Z-gQ/viewform?usp=header",
"https://docs.google.com/forms/d/e/1FAIpQLSc_T3Jr43r3KsZMcR0RKUmdmnLO2yuAv6rR4tozKmoLBswJZg/viewform?usp=publish-editor",
"https://docs.google.com/forms/d/e/1FAIpQLSchPu8lF4pVqyRL08ImavcTw1aY-yTm4I8c5GJAC6kG5MYG4A/viewform?usp=header",
"https://docs.google.com/forms/d/e/1FAIpQLSfjdioYWGSBiWrgnPhZGYw0BDFmyp828-dkgH4ra9LsHno68A/viewform?usp=header",
"https://docs.google.com/forms/d/e/1FAIpQLScTt7WlSNDhwDpJsjWk4VB2HSxHPhuiTNQ90kzZdyPMJYaeyw/viewform?usp=header",
"https://docs.google.com/forms/d/e/1FAIpQLScFbuo0NkA1J67uVrBM1u4tcpQn3ObQk_L5q11o6zRe2_VilA/viewform?usp=header",
"https://docs.google.com/forms/d/e/1FAIpQLSd79WvNTYAN2NYe6wFYNNGok85yVmosuPgFA2R-ge3KSuFEVA/viewform?usp=header"
  // ← add more links here anytime
];

// Change this value to reset everyone's lock (e.g. for a new exam batch)
const LOCK_KEY = 'gtnx_exam_lock_v1';
// ============================================================


// Fixed order (no shuffle) so "Set N" always means the same link
const SETS = LINKS.map((url, i) => ({ name: `Set ${i + 1}`, url }));

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const SEG = SETS.length;
const SEG_ANG = TAU / SEG;

const COLORS   = ['#0B4C91','#F0F6FF','#7A1FA8','#E8E6FF','#FFD23D','#0EA5E9','#0A1E4D','#FDF0FF','#D6249B','#C9E9FF','#1B0F5C','#FFF2C2','#118AB2','#FFE1F5','#4B0F91'];
const TEXT_DARK  = '#070B1E';
const TEXT_LIGHT = '#EAF4FF';
const TEXT_CLR   = [TEXT_LIGHT,TEXT_DARK,TEXT_LIGHT,TEXT_DARK,TEXT_DARK,TEXT_LIGHT,TEXT_LIGHT,TEXT_DARK,TEXT_LIGHT,TEXT_DARK,TEXT_LIGHT,TEXT_DARK,TEXT_LIGHT,TEXT_DARK,TEXT_LIGHT];

let rot = Math.random() * TAU;
let spinning = false;
let audioCtx = null, lastTick = 0;

const spinBtn = document.getElementById('spinBtn');

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTick(vol=0.16, freq=900) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.04);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.045);
}
function playLand() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  [0,0.1,0.22].forEach((t,i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='triangle'; o.frequency.value=[660,880,1100][i];
    g.gain.setValueAtTime(0.22,now+t);
    g.gain.exponentialRampToValueAtTime(0.001,now+t+0.2);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now+t); o.stop(now+t+0.22);
  });
}

function drawWheel(r) {
  const sz=canvas.width, cx=sz/2, cy=sz/2, rad=sz/2-18;
  ctx.clearRect(0,0,sz,sz);

  // Outer glow disc
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rad+14,0,TAU);
  ctx.fillStyle='rgba(255,46,154,0.10)';
  ctx.shadowColor='rgba(255,46,154,0.6)'; ctx.shadowBlur=28;
  ctx.fill(); ctx.restore();

  // Segments
  for(let i=0;i<SEG;i++) {
    const s=i*SEG_ANG+r, e=s+SEG_ANG;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rad,s,e); ctx.closePath();
    ctx.fillStyle=COLORS[i % COLORS.length]; ctx.fill();

    // Sheen
    const gs=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    gs.addColorStop(0,'rgba(255,255,255,0.28)');
    gs.addColorStop(0.45,'rgba(255,255,255,0.06)');
    gs.addColorStop(1,'rgba(0,0,0,0.25)');
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rad,s,e); ctx.closePath();
    ctx.fillStyle=gs; ctx.fill();

    // Divider lines
    ctx.save();
    ctx.strokeStyle='rgba(10,8,40,0.55)'; ctx.lineWidth=2.5;
    ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=3;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rad,s,e); ctx.closePath();
    ctx.stroke(); ctx.restore();

    // Label
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(s+SEG_ANG/2);
    const fs = Math.min(18, rad/4.8);
    ctx.font = `900 ${fs}px 'Nunito','Segoe UI'`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const tc = TEXT_CLR[i % TEXT_CLR.length];
    ctx.strokeStyle = tc === TEXT_LIGHT ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.7)';
    ctx.lineWidth=4; ctx.lineJoin='round';
    ctx.strokeText(SETS[i].name, rad*0.62, 0);
    ctx.fillStyle=tc;
    ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=4;
    ctx.fillText(SETS[i].name, rad*0.62, 0);
    ctx.restore();
  }

  // Tick marks around rim
  const tickCount = SEG * 4;
  for(let i=0;i<tickCount;i++) {
    const angle = (i / tickCount) * TAU + r;
    const isMajor = i % 4 === 0;
    const outerR = rad + 2;
    const innerR = rad - (isMajor ? 14 : 7);
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(innerR, 0); ctx.lineTo(outerR, 0);
    ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = isMajor ? 3 : 1.5;
    ctx.shadowColor = 'rgba(255,210,61,0.8)'; ctx.shadowBlur = isMajor ? 8 : 3;
    ctx.stroke(); ctx.restore();
  }

  // Dot ring just inside the rim
  const dotCount = SEG * 3;
  for(let i=0;i<dotCount;i++) {
    const angle = (i / dotCount) * TAU + r;
    const dr = rad - 22;
    const dx = cx + Math.cos(angle) * dr;
    const dy = cy + Math.sin(angle) * dr;
    ctx.save();
    ctx.beginPath(); ctx.arc(dx, dy, 3, 0, TAU);
    ctx.fillStyle = i % 3 === 0 ? 'rgba(255,196,46,0.85)' : 'rgba(255,255,255,0.45)';
    ctx.shadowColor='rgba(255,196,46,0.6)'; ctx.shadowBlur=6;
    ctx.fill(); ctx.restore();
  }

  // Center hub
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,44,0,TAU);
  ctx.fillStyle='#03050F';
  ctx.shadowColor='rgba(255,46,154,0.9)'; ctx.shadowBlur=20;
  ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,32,0,TAU);
  const hg = ctx.createRadialGradient(cx,cy,0,cx,cy,32);
  hg.addColorStop(0,'#29D6FF'); hg.addColorStop(1,'#FF2E9A');
  ctx.fillStyle=hg; ctx.fill();
  ctx.fillStyle='#EAF4FF';
  ctx.font='bold 13px "Nunito"'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=5;
  ctx.fillText('GT',cx,cy-7); ctx.fillText('NX',cx,cy+8);
  ctx.restore();
}

function getIdx(r) {
  let a=(-Math.PI/2-r)%TAU; if(a<0) a+=TAU;
  return Math.min(Math.floor(a/SEG_ANG),SEG-1);
}
function rotForIdx(idx) {
  const ptr=-Math.PI/2, ctr=idx*SEG_ANG+SEG_ANG/2;
  return ((ptr-ctr)%TAU+TAU)%TAU;
}

// ── CONFETTI ──
const CONFETTI_SHAPES = ['★','●','■','▲','♦'];
const CONFETTI_COLORS = ['#FF2E9A','#FFD700','#9CF0FF','#29D6FF','#EAF4FF','#00A8FF','#FFD23D'];
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  for(let i=0;i<55;i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = CONFETTI_SHAPES[Math.floor(Math.random()*CONFETTI_SHAPES.length)];
    el.style.cssText = `
      left: ${20+Math.random()*60}%;
      top: ${30+Math.random()*20}%;
      font-size: ${10+Math.random()*16}px;
      color: ${CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)]};
      animation-duration: ${1.2+Math.random()*1.6}s;
      animation-delay: ${Math.random()*0.4}s;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    `;
    container.appendChild(el);
  }
  setTimeout(()=>container.innerHTML='', 3000);
}

// ── POW BUBBLE ──
const WORDS = ['POW!','BAM!','WOW!','YAY!','🔥'];
function showPow() {
  const el = document.getElementById('powBubble');
  el.textContent = WORDS[Math.floor(Math.random()*WORDS.length)];
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1500);
}

// ── LOCK (one spin per browser) ──
function readLock() {
  try {
    const saved = JSON.parse(localStorage.getItem(LOCK_KEY));
    if (!saved || !saved.url) return null;
    const idx = SETS.findIndex(s => s.url === saved.url);
    return idx >= 0 ? idx : null;
  } catch (e) { return null; }
}
function saveLock(idx) {
  try {
    localStorage.setItem(LOCK_KEY, JSON.stringify({ url: SETS[idx].url, t: Date.now() }));
  } catch (e) {}
}
function lockButton() {
  spinBtn.disabled = true;
  spinBtn.textContent = '🔒 ALREADY SPUN';
  const note = document.getElementById('spinNote');
  note.textContent = 'You already used your spin. Your result stays the same.';
  note.classList.add('used');
}
function renderResult(set) {
  document.getElementById('resultText').textContent = set.name;
  document.getElementById('linkWrap').innerHTML =
    `<a href="${set.url}" target="_blank" rel="noopener" class="open-btn">OPEN ${set.name} →</a>`;
}
function restoreLock() {
  const idx = readLock();
  if (idx === null) return false;
  rot = rotForIdx(idx);
  drawWheel(rot);
  renderResult(SETS[idx]);
  lockButton();
  return true;
}

let startRot, targetRot, spinStart, spinDur;
function animate(now) {
  const elapsed=now-spinStart, t=Math.min(1,elapsed/spinDur);
  const ease=1-Math.pow(1-t,3.8);
  rot=(startRot+(targetRot-startRot)*ease)%TAU;
  drawWheel(rot);
  if(audioCtx) {
    const delay=28+t*165;
    if(now-lastTick>delay) { playTick(0.19-t*0.08, 1080-t*480); lastTick=now; }
  }
  if(t<1) { requestAnimationFrame(animate); return; }
  rot=targetRot%TAU; drawWheel(rot);
  const idx=getIdx(rot); showResult(SETS[idx]); playLand();
  spinning=false;
  lockButton(); // stays locked after the spin
}

function showResult(set) {
  renderResult(set);
  const card=document.getElementById('resultCard');
  card.style.transform='scale(1.04)'; setTimeout(()=>card.style.transform='scale(1)',200);
  launchConfetti();
  showPow();
}

spinBtn.onclick=()=>{
  if(spinning) return;
  if(readLock() !== null) { lockButton(); return; } // already spun

  initAudio(); spinning=true; lastTick=0;
  spinBtn.disabled=true;

  const idx=Math.floor(Math.random()*SEG);
  saveLock(idx); // saved at click time, so refreshing mid-spin can't re-roll

  startRot=rot; targetRot=rotForIdx(idx)+(8+Math.random()*7)*TAU;
  spinStart=performance.now(); spinDur=3400+Math.random()*900;
  requestAnimationFrame(animate);
};

if (!restoreLock()) drawWheel(rot);
</script>
</body>
</html>
